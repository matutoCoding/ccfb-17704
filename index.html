<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏂</text></svg>" />
    <title>雪场公园设计与腾空推演系统</title>
  </head>
  <body>
    <div id="app">
      <nav class="nav" id="nav"></nav>
      <aside class="panel" id="panel"></aside>
      <main class="stage">
        <div id="viewport"></div>
        <div class="topbar">
          <div class="topbar-title">
            <strong id="planName">地形公园工作室</strong>
            <span id="saveState" class="save-state">—</span>
          </div>
          <div class="topbar-right">
            <span id="fpsPill" class="fps-pill" title="渲染帧率（自适应分辨率保 45fps）">-- fps</span>
          </div>
        </div>
        <div id="viewportHint" class="viewport-hint"></div>
        <div id="povBar" class="pov-bar hidden"></div>
        <div id="toast" class="toast hidden"></div>
        <section id="compareHost" class="compare-host hidden"></section>
      </main>
    </div>
    <input type="file" id="hiddenFile" accept=".json,.csv,.txt" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
